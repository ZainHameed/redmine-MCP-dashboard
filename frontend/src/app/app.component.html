<div style="position: absolute; top: 1.5rem; right: 2rem; z-index: 10; display: flex; gap: 10px;">
  <button mat-raised-button color="primary" (click)="checkHealth()" [disabled]="healthCheckLoading">
    <mat-icon>health_and_safety</mat-icon>
    {{ healthCheckLoading ? 'Checking...' : 'Health Check' }}
  </button>
  <span style="font-weight: bold; color: #3f51b5; background: #fff; border-radius: 20px; padding: 8px 16px; box-shadow: 0 2px 8px rgba(0,0,0,0.08);">👤 zain.hameed</span>
</div>
<mat-card style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
  <div>
    <h1 style="margin: 0;">Redmine Projects Dashboard</h1>
    <span style="color: #666; font-size: 0.9em;">Version {{ appVersion }}</span>
  </div>
</mat-card>
<mat-card style="margin-bottom: 20px;">
  <app-ticket-lookup></app-ticket-lookup>
</mat-card>
<mat-tab-group [(selectedIndex)]="tabIndex" mat-stretch-tabs (selectedTabChange)="onTabChange($event)">
  <mat-tab>
    <ng-template mat-tab-label>
      <mat-icon>dashboard</mat-icon> My Projects
    </ng-template>
  </mat-tab>
  <mat-tab>
    <ng-template mat-tab-label>
      <mat-icon>bar_chart</mat-icon> Productivity
    </ng-template>
  </mat-tab>
</mat-tab-group>

<!-- Router outlet outside tabs for proper content switching -->
<div style="padding: 20px;">
  <router-outlet></router-outlet>
</div>
